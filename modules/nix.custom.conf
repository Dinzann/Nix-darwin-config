# Determinate Nix user config → /etc/nix/nix.custom.conf
# Install: ~/.config/nix-darwin/scripts/install-mirrors.sh
#
# Binary caches for China (priority 越小越优先；官方 cache 作后备)

extra-substituters = https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store?priority=10 https://mirrors.ustc.edu.cn/nix-channels/store?priority=15
